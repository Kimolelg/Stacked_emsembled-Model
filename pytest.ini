[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
markers =
    slow: tests that train models or hit external services (skip in default CI with -m "not slow")
    integration: needs local artifacts / optional services
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
